schema_version: 1
id: profit_growth_5y
name: 5年利润增速(%)
description: 截至当日已公告年报中归母净利润相对五年前的复合增速。
category: growth
tags: [financial, annual, rolling, point_in_time]
type: cross_section
grain: security_date
engine: polars
execution: {mode: point_in_time, frequency: annual}
inputs: {value: financial.income.n_income_attr_p}
expression: 'round(cagr(col("value"), 5) * 100.0, 2)'
output: {dtype: float64, unit: percent, direction: higher_better}
policies: {null: propagate, point_in_time: strict, enabled: true}
