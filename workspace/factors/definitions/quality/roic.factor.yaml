schema_version: 1
id: roic
name: ROIC(%)
description: 截至当日已公告年报中的最新投入资本回报率。
category: quality
tags: [financial, annual, point_in_time]
type: cross_section
grain: security_date
engine: polars
execution: {mode: point_in_time, frequency: annual}
inputs: {value: financial.fina_indicator.roic}
expression: 'round(col("value"), 2)'
output: {dtype: float64, unit: percent, direction: higher_better}
policies: {null: propagate, point_in_time: strict, enabled: true}
