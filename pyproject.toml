[project]
name = "thesis-backtester"
dynamic = ["version"]
description = "AI-powered investment analysis framework with structured operator composition and multi-baseline backtesting"
requires-python = ">=3.9"
license = "AGPL-3.0-or-later"
readme = "README.md"
keywords = ["investment", "backtest", "llm", "ai", "analysis", "operator", "dag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    # 核心
    "pandas>=1.5",
    "polars>=1.0,<2",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "python-dateutil>=2.8",
    # LLM
    "openai>=1.0",
    # 数据源
    "baostock>=0.9.3",
    "tushare>=1.2",
    "akshare>=1.14",
    # Web
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "websockets>=12.0",
    "pywebview>=4.4",
    # 可视化
    "matplotlib>=3.5",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1",
    "pytest>=7.0",
]

[project.urls]
Repository = "https://github.com/turtlequant/thesis-backtester"

[project.scripts]
thesis-backtester = "src.engine.launcher:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.dynamic]
version = { attr = "src.version.__version__" }

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "ruff>=0.1",
    "pytest>=7.0",
]
build = [
    "nuitka>=2.6",
    "ordered-set>=4.1",
    "zstandard>=0.23",
]
